name: Build and release FitLife Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# If several commits arrive while a build is running, the newest pending run
# replaces older pending runs; the last push is still released after the active one.
concurrency:
  group: fitlife-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tanish975/FitLife' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write # required to publish the GitHub Release
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;36.0.0'
      - name: Calculate a monotonic Android version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Local candidates use versionCodes 12, 13 and 14. Future public builds
          # must be strictly newer so the in-app updater can recognize them.
          code=$((RUN_NUMBER + 5))
          if (( code <= 14 )); then echo 'VersionCodes 12, 13 and 14 are reserved for local candidates; a newer workflow run is required.' >&2; exit 1; fi
          if (( code > 2100000000 )); then echo 'Android versionCode limit reached.' >&2; exit 1; fi
          name="1.0.$code"
          tag="v$name"
          # Fail closed on an API error; check every published stable FitLife-style tag,
          # not just the release currently marked as latest.
          published_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          while IFS= read -r published; do
            if [[ "$published" =~ ^v[0-9]{1,4}\.[0-9]{1,4}\.([1-9][0-9]{0,9})$ ]] && (( code <= 10#${BASH_REMATCH[1]} )); then
              echo "Refusing to publish $tag: $published is already as new or newer. See mobile/RELEASING.md." >&2
              exit 1
            fi
          done <<< "$published_tags"
          printf 'FITLIFE_VERSION_CODE=%s\nFITLIFE_VERSION_NAME=%s\nFITLIFE_RELEASE_TAG=%s\n' "$code" "$name" "$tag" >> "$GITHUB_ENV"
          echo "Building $tag, Android versionCode $code"
      - name: Install dependencies
        run: npm ci
      - name: Test native release validation
        run: npm run test:native
      - name: Test Firestore rules with a local emulator
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/fitlife-firestore-emulator.jar"
          curl -fsSL 'https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar' -o "$jar"
          echo '9d43599ed6151199e8d604dc87fac51218e49e5f3a48519b1ae560bbe5e3382d  '"$jar" | sha256sum --check --status
          java -Xmx256m -jar "$jar" --host 127.0.0.1 --port 8188 --rules "$GITHUB_WORKSPACE/mobile/firestore.rules" --project_id demo-fitlife --single_project_mode true > "$RUNNER_TEMP/fitlife-firestore.log" 2>&1 &
          emulator=$!
          trap 'kill "$emulator" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -s --max-time 2 http://127.0.0.1:8188/ > /dev/null; then break; fi
            if ! kill -0 "$emulator" 2>/dev/null; then cat "$RUNNER_TEMP/fitlife-firestore.log"; exit 1; fi
            sleep 1
          done
          curl -s --max-time 2 http://127.0.0.1:8188/ > /dev/null
          npm run test:rules
      - name: Build self-contained web app
        run: npm run build:standalone
      - name: Build and verify signed Android APK
        env:
          KEY_B64: ${{ secrets.FITLIFE_SIGNING_KEY_PK8_BASE64 }}
          CERT_B64: ${{ secrets.FITLIFE_SIGNING_CERT_PEM_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_B64" || -z "$CERT_B64" ]]; then
            echo 'Add the two FITLIFE_SIGNING_* repository secrets before releasing. See mobile/RELEASING.md.' >&2
            exit 1
          fi
          keydir="$RUNNER_TEMP/fitlife-signing"
          mkdir -p "$keydir"; chmod 700 "$keydir"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "$KEY_B64" | base64 --decode > "$keydir/key.pk8"
          printf '%s' "$CERT_B64" | base64 --decode > "$keydir/cert.pem"
          chmod 600 "$keydir"/*
          FITLIFE_SIGNING_KEY="$keydir/key.pk8" FITLIFE_SIGNING_CERT="$keydir/cert.pem" \
            ANDROID_BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/36.0.0" \
            bash scripts/build-apk.sh
      - name: Verify package, version, signature and embedded app
        run: bash scripts/verify-apk.sh
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test age safety, food, progress and device cap (simulated native bridge)
        continue-on-error: true
        run: |
          set -euo pipefail
          # Smoke test: verify Chromium can launch before running browser tests
          node --input-type=module -e "
            import { chromium } from 'playwright';
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            console.log('Chromium launch smoke test: OK');
            await browser.close();
          " || { echo "## Chromium smoke test FAILED" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "## Chromium smoke test: OK" >> "$GITHUB_STEP_SUMMARY"
          node qa/phase0-unit.mjs || { echo "## Phase0 unit test FAILED" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "## Phase0 unit test: OK" >> "$GITHUB_STEP_SUMMARY"
          node qa/phase0-browser.mjs || { echo "## Phase0 browser test FAILED" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "## Phase0 browser test: OK" >> "$GITHUB_STEP_SUMMARY"
      - name: Test expanded exercise catalog, filters and data preservation
        run: npm run test:exercises
      - name: Test movement previews and local water schedule (simulated native bridge)
        run: npm run test:motion-water
      - name: Test IFCT 2017, household portions, raw/cooked, oil/ghee and custom recipes
        run: npm run test:indian-nutrition
      - name: Test FitLife Global FoodDB across world regions, edible categories and lab tables
        run: npm run test:global-fooddb
      - name: Test account isolation and sync (simulated native bridge)
        run: npm run test:cloud
      - name: Test release build, animations, updates, standalone and offline use
        run: |
          set -euo pipefail
          npm run build
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/fitlife-preview.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          FITLIFE_URL=http://127.0.0.1:4173/ npm run test:qa
          FITLIFE_URL=http://127.0.0.1:4173/ npm run test:theme
          FITLIFE_URL=http://127.0.0.1:4173/ npm run test:updates
          npm run test:standalone
          FITLIFE_PROD_URL=http://127.0.0.1:4173/ npm run test:offline
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$FITLIFE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $FITLIFE_RELEASE_TAG already exists; refusing to overwrite published APKs." >&2
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          sha256sum FitLife.apk FitLife-App.html > SHA256SUMS.txt
          cat > "$RUNNER_TEMP/fitlife-notes.md" <<EOF
          ## Install on Android
          Back up your FitLife data with the encrypted export before updating, and keep the passphrase safe.
          Download **FitLife.apk**, open it on Android 8.0 or later, and confirm installation.
          Install over your existing compatible signed FitLife app; do not uninstall or clear app data.
          Android may ask you to allow your browser to install apps and confirm the update.

          **FitLife-App.html** is the standalone offline web build; native Google sign-in requires the Android app.

          Android versionCode: $FITLIFE_VERSION_CODE

          Source commit: $GITHUB_SHA

          SHA-256 hashes are in SHA256SUMS.txt.
          EOF
          cat "$GITHUB_WORKSPACE/RELEASE-HIGHLIGHTS.md" >> "$RUNNER_TEMP/fitlife-notes.md"
          gh release create "$FITLIFE_RELEASE_TAG" FitLife.apk FitLife-App.html SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FitLife $FITLIFE_RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/fitlife-notes.md" --latest
          echo "### Published $FITLIFE_RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/latest" >> "$GITHUB_STEP_SUMMARY"
